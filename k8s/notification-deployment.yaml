apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: sharetrip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      automountServiceAccountToken: false
      containers:
        - name: notification
          image: sharetrip/notification:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: sharetrip
spec:
  selector:
    app: notification
  ports:
    - name: http
      port: 8080
      targetPort: http
