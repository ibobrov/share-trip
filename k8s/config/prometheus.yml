global:
  scrape_interval: 10s
scrape_configs:
  - job_name: sharetrip
    static_configs:
      - targets: ['sharetrip-service:8080']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter-sharetrip:9187', 'postgres-exporter-contract:9187', 'postgres-exporter-notification:9187']
  - job_name: contract
    static_configs:
      - targets: ['contract-service:8080']
  - job_name: notification
    static_configs:
      - targets: ['notification-service:8080']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
