# Copy to sharetrip-secret.yaml and replace placeholders before applying.
apiVersion: v1
kind: Secret
metadata:
  name: sharetrip-secret
  namespace: sharetrip
type: Opaque
stringData:
  DATABASE_DSN: "postgres://sharetrip:<password>@postgres-sharetrip:5432/sharetrip?sslmode=disable"
  KEYCLOAK_CLIENT_SECRET: "<keycloak-client-secret>"
