apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharetrip
  namespace: sharetrip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sharetrip
  template:
    metadata:
      labels:
        app: sharetrip
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sharetrip
          image: sharetrip/sharetrip:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sharetrip-config
            - secretRef:
                name: sharetrip-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sharetrip-service
  namespace: sharetrip
spec:
  selector:
    app: sharetrip
  ports:
    - name: http
      port: 8080
      targetPort: http
