apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "alloy"
  namespace: "sharetrip"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "alloy"
  namespace: "sharetrip"
rules:
  -
    apiGroups:
      - ""
    resources:
      - "pods"
      - "pods/log"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "alloy"
  namespace: "sharetrip"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "alloy"
subjects:
  -
    kind: "ServiceAccount"
    name: "alloy"
    namespace: "sharetrip"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "alloy"
  namespace: "sharetrip"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "alloy"
  template:
    metadata:
      labels:
        app: "alloy"
    spec:
      automountServiceAccountToken: true
      containers:
        -
          name: "alloy"
          image: "grafana/alloy@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              name: "http"
              containerPort: 12345
          args:
            - "run"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "/etc/alloy/config.alloy"
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/alloy/config.alloy"
              subPath: "config.alloy"
              readOnly: true
          readinessProbe:
            httpGet:
              path: "/-/ready"
              port: 12345
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: "/-/ready"
              port: 12345
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
      volumes:
        -
          name: "config"
          configMap:
            name: "alloy-config"
      serviceAccountName: "alloy"
  strategy:
    type: "Recreate"
