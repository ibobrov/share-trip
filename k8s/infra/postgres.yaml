apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres-sharetrip"
  namespace: "sharetrip"
spec:
  type: "ClusterIP"
  selector:
    app: "postgres-sharetrip"
  ports:
    -
      name: "postgres"
      port: 5432
      targetPort: 5432
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "postgres-sharetrip"
  namespace: "sharetrip"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "postgres-sharetrip"
  template:
    metadata:
      labels:
        app: "postgres-sharetrip"
    spec:
      automountServiceAccountToken: false
      containers:
        -
          name: "postgres-sharetrip"
          image: "postgres:16"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              name: "postgres"
              containerPort: 5432
          env:
            -
              name: "POSTGRES_USER"
              valueFrom:
                secretKeyRef:
                  name: "postgres-sharetrip-secret"
                  key: "POSTGRES_USER"
            -
              name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "postgres-sharetrip-secret"
                  key: "POSTGRES_PASSWORD"
            -
              name: "POSTGRES_DB"
              valueFrom:
                secretKeyRef:
                  name: "postgres-sharetrip-secret"
                  key: "POSTGRES_DB"
            -
              name: "PGDATA"
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql/data"
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "postgres-sharetrip"
  serviceName: "postgres-sharetrip"
---
