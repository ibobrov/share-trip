apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract
  namespace: sharetrip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract
  template:
    metadata:
      labels:
        app: contract
    spec:
      automountServiceAccountToken: false
      containers:
        - name: contract
          image: sharetrip/contract:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: contract-config
            - secretRef:
                name: contract-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: contract-service
  namespace: sharetrip
spec:
  selector:
    app: contract
  ports:
    - name: http
      port: 8080
      targetPort: http
