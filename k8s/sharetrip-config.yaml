apiVersion: v1
kind: ConfigMap
metadata:
  name: sharetrip-config
  namespace: sharetrip
data:
  HTTP_PORT: "8080"
  APP_ENV: "local"
  LOG_LEVEL: "INFO"
  CONTRACT_SERVICE_URL: "http://contract-service:8080"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TRIP_TOPIC: "trip.events"
  REQUEST_TIMEOUT_MS: "2000"
  CONTRACT_REQUEST_TIMEOUT_MS: "500"
  CONTRACT_CHECK_TIMEOUT_MS: "1200"
  RETRY_ATTEMPTS: "2"
  RETRY_DELAY_MS: "100"
  KAFKA_PUBLISH_TIMEOUT_MS: "1000"
  KAFKA_PUBLISH_ATTEMPTS: "3"
  OUTBOX_POLL_INTERVAL_MS: "1000"
  OUTBOX_BATCH_TIMEOUT_MS: "15000"
  OUTBOX_BATCH_SIZE: "10"
  OUTBOX_MAX_ATTEMPTS: "10"
  KEYCLOAK_ISSUER: "http://keycloak:8080/realms/sharetrip"
  KEYCLOAK_CLIENT_ID: "sharetrip-api"
  KEYCLOAK_TIMEOUT_MS: "5000"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4318"
